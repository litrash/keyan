<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科研进度管理</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🧪</span>
    <div>
      <h1>科研进度管理</h1>
      <div class="sub">课题 · 实验 · 文献 · 时间线</div>
    </div>
  </div>
  <nav class="tabs" id="tabBar">
    <button class="tab-btn active" data-tab="board">📋 进度看板</button>
    <button class="tab-btn" data-tab="experiments">🧫 实验记录</button>
    <button class="tab-btn" data-tab="papers">📚 论文文献</button>
    <button class="tab-btn" data-tab="timeline">🗓 时间线</button>
    <button class="tab-btn" data-tab="stats">📈 统计</button>
  </nav>
  <div class="actions">
    <button class="btn ghost" id="btnExport" title="导出全部数据为 JSON">⬇ 导出</button>
    <button class="btn ghost" id="btnImport" title="从 JSON 导入">⬆ 导入</button>
    <button class="btn ghost" id="btnCloudNow" title="立即与云端同步">☁ 同步</button>
    <button class="btn ghost" id="btnDemo" title="载入示例数据（覆盖当前数据）">🎁 示例</button>
    <button class="btn ghost danger" id="btnClear" title="清空所有数据">🗑 清空</button>
    <div class="user-box" id="userBox" hidden>
      <span class="email" id="userEmail"></span>
      <button class="btn ghost" id="btnLogout" title="退出登录">退出</button>
    </div>
  </div>
</header>

<main>
  <!-- ================= 进度看板 ================= -->
  <section class="panel active" id="panel-board">
    <div class="panel-head">
      <h2>进度看板</h2>
      <button class="btn primary" data-new="task">＋ 新建任务</button>
    </div>
    <div class="kanban" id="kanban"></div>
  </section>

  <!-- ================= 实验记录 ================= -->
  <section class="panel" id="panel-experiments">
    <div class="panel-head">
      <h2>实验记录 / 数据</h2>
      <div class="head-tools">
        <input type="text" class="search" id="expSearch" placeholder="🔍 搜索实验名 / 标签 / 结论">
        <button class="btn primary" data-new="experiment">＋ 新建实验</button>
      </div>
    </div>
    <div class="cards" id="expList"></div>
    <div class="empty" id="expEmpty" hidden>还没有实验记录，点右上角「新建实验」开始。</div>
  </section>

  <!-- ================= 论文文献 ================= -->
  <section class="panel" id="panel-papers">
    <div class="panel-head">
      <h2>论文 / 文献管理</h2>
      <div class="head-tools">
        <input type="text" class="search" id="paperSearch" placeholder="🔍 搜索标题 / 作者 / 期刊">
        <button class="btn primary" data-new="paper">＋ 新建文献</button>
      </div>
    </div>
    <div class="filters" id="paperFilters"></div>
    <div class="cards" id="paperList"></div>
    <div class="empty" id="paperEmpty" hidden>还没有文献记录。</div>
  </section>

  <!-- ================= 时间线 ================= -->
  <section class="panel" id="panel-timeline">
    <div class="panel-head">
      <h2>时间线 / 里程碑</h2>
      <button class="btn primary" data-new="milestone">＋ 新建里程碑</button>
    </div>
    <div class="timeline" id="timeline"></div>
    <div class="empty" id="tlEmpty" hidden>还没有里程碑，新建一个吧。</div>

    <div class="panel-head" style="margin-top:26px">
      <h2>近期截止</h2>
    </div>
    <div class="cards" id="dueList"></div>
  </section>

  <!-- ================= 统计 ================= -->
  <section class="panel" id="panel-stats">
    <div class="stats-row" id="statsRow"></div>
    <div class="chart-grid">
      <div class="chart-box"><h3>各阶段任务分布</h3><div class="chart-body"><canvas id="ch-stage"></canvas></div></div>
      <div class="chart-box"><h3>任务优先级</h3><div class="chart-body"><canvas id="ch-priority"></canvas></div></div>
      <div class="chart-box"><h3>实验进度</h3><div class="chart-body"><canvas id="ch-exp"></canvas></div></div>
      <div class="chart-box"><h3>文献投稿状态</h3><div class="chart-body"><canvas id="ch-paper"></canvas></div></div>
      <div class="chart-box wide"><h3>近 8 周完成任务数</h3><div class="chart-body"><canvas id="ch-weekly"></canvas></div></div>
    </div>
  </section>
</main>

<footer class="foot">
  科研进度管理 · 数据保存在云端账号下，本机保留离线缓存
  <span id="saveHint"></span>
  <span id="syncState"></span>
</footer>

<!-- ================= 登录 / 注册 ================= -->
<div id="authGate" hidden>
  <div class="auth-card">
    <div class="logo">🧪</div>
    <h2 id="authTitle">登录科研进度管理</h2>
    <div class="sub" id="authSub">登录后可在任意电脑访问你的科研进度</div>
    <div class="auth-msg" id="authMsg"></div>
    <form id="authForm">
      <div class="field">
        <label>邮箱</label>
        <input type="email" id="authEmail" autocomplete="username" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="authPassword" autocomplete="current-password" placeholder="至少 8 位" required>
      </div>
      <div class="field" id="authConfirmWrap" hidden>
        <label>确认密码</label>
        <input type="password" id="authPassword2" autocomplete="new-password" placeholder="再输入一次">
      </div>
      <div class="row">
        <input type="checkbox" id="authRemember">
        <label for="authRemember">记住我（关闭浏览器后仍保持登录）</label>
      </div>
      <button type="submit" class="btn primary" id="authSubmit">登录</button>
    </form>
    <div class="auth-switch">
      <span id="authSwitchText">还没有账号？</span>
      <a id="authSwitchLink">立即注册</a>
    </div>
    <div class="auth-note">
      🔒 密码经 PBKDF2 加盐哈希后存储，服务器不保存明文<br>
      每个账号只能看到自己的科研进度
    </div>
  </div>
</div>

<!-- ================= 编辑弹窗 ================= -->
<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">编辑</h3>
      <button class="icon-btn" id="modalClose">✕</button>
    </div>
    <form id="modalForm" class="modal-body"></form>
    <div class="modal-foot">
      <button class="btn ghost danger" id="btnDelete" type="button" hidden>删除</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="btnCancel" type="button">取消</button>
      <button class="btn primary" id="btnSave" type="submit" form="modalForm">保存</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json,.json" hidden>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="assets/cloud.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
